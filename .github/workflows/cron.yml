name: Scheduled Ingestion

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ingest:
    name: Run all scrapers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Trigger ingestion cron endpoint
        env:
          API_KEY: ${{ secrets.GOOGLE_SHEETS_SYNC_API_KEY }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          curl -sSf -w "\nHTTP %{http_code}" \
            -H "Authorization: Bearer ${API_KEY}" \
            "${APP_URL:-https://e3evint.e3personnel.com}/api/ingest/run" \
            || echo "CURL_EXIT=$?" >> "$GITHUB_ENV"
