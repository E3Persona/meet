name: Ingest Scraper

on:
  workflow_dispatch:
    inputs:
      scraper:
        description: "Scraper script name (e.g. ingest-thetradeshowcalendar.ts)"
        required: true
        type: string
      trigger:
        description: "Trigger type"
        required: false
        default: "manual"
        type: choice
        options:
          - manual
          - scheduled
      date_from:
        description: "Start date (YYYY-MM-DD)"
        required: false
        type: string
      date_to:
        description: "End date (YYYY-MM-DD)"
        required: false
        type: string
      run_id:
        description: "IngestionRun ID from the database"
        required: false
        type: string
      force_refresh:
        description: "Force refresh (skip staleness check)"
        required: false
        default: false
        type: boolean

jobs:
  run-scraper:
    name: Run ${{ inputs.scraper }}
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Run scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RUN_ID: ${{ inputs.run_id }}
          DATE_FROM: ${{ inputs.date_from || '' }}
          DATE_TO: ${{ inputs.date_to || '' }}
          FORCE_REFRESH: ${{ inputs.force_refresh && '1' || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          WEBPEEL_API_KEY: ${{ secrets.WEBPEEL_API_KEY }}
        run: pnpm exec tsx scripts/${{ inputs.scraper }}
